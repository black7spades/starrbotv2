services:
  bot:
    image: ghcr.io/black7spades/starrbotv2:latest
    container_name: starrbot-v2
    restart: unless-stopped
    ports:
      - "2013:2013"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
    networks:
      - starrbot-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "dockhand.enable=true"
      - "dockhand.name=StarrBot v2"

networks:
  starrbot-network:
    driver: bridge
