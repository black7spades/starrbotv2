services:
  bot:
    image: ghcr.io/black7spades/starrbotv2:latest
    container_name: starrbot-v2
    restart: unless-stopped
    ports:
      - "2013:2013"
    volumes:
      - ./data:/app/data
    # No .env file needed - secrets auto-generated at runtime
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
      - BASE_URL=${BASE_URL}
      # Optional: override auto-generated secrets
      # - JWT_SECRET=your-custom-secret
      # - JWT_REFRESH_SECRET=your-custom-refresh-secret
      # - COOKIE_SECRET=your-custom-cookie-secret
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - starrbot-network
    labels:
      - "dockhand.enable=true"
      - "dockhand.name=StarrBot v2"

  redis:
    image: redis:7-alpine
    container_name: starrbot-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - starrbot-network

  rsshub:
    image: diygod/rsshub:chromium-bundled
    container_name: starrbot-rsshub
    restart: unless-stopped
    ports:
      - "1200:1200"
    env_file:
      - .env
    environment:
      - CACHE_TYPE=memory
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1200/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - starrbot-network

volumes:
  redis-data:

networks:
  starrbot-network:
    driver: bridge
