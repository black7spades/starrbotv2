services:
  bot:
    image: ghcr.io/black7spades/starrbotv2:latest
    container_name: starrbot-v2
    restart: unless-stopped
    ports:
      - "2013:2013"
    volumes:
      - ./data:/app/data
    # No .env file needed - secrets auto-generated at runtime
    environment:
      - NODE_ENV=production
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
      - BASE_URL=${BASE_URL}
      # Optional: override auto-generated secrets. Names must match what the
      # app/entrypoint read — JWT_ACCESS_SECRET, not JWT_SECRET.
      # - JWT_ACCESS_SECRET=your-custom-access-secret
      # - JWT_REFRESH_SECRET=your-custom-refresh-secret
      # - COOKIE_SECRET=your-custom-cookie-secret
    networks:
      - starrbot-network
    labels:
      - "dockhand.enable=true"
      - "dockhand.name=StarrBot v2"

  rsshub:
    image: diygod/rsshub:chromium-bundled
    container_name: starrbot-rsshub
    restart: unless-stopped
    ports:
      - "1200:1200"
    environment:
      CACHE_TYPE: "memory"
      # Never hardcode this - it is a live Instagram session credential.
      # Put INSTAGRAM_COOKIE in a local .env file (gitignored) instead.
      INSTAGRAM_COOKIE: ${INSTAGRAM_COOKIE:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1200/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - starrbot-network

networks:
  starrbot-network:
    driver: bridge
